<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแอปพลิเคชัน</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #ffffff;
        }
        /* ดันแถบฟ้าของ Google หลุดขอบจอขึ้นไปด้านบน */
        iframe { 
            position: absolute; 
            top: -15px; 
            left: 0; 
            width: 100%; 
            height: calc(100% + 50px); 
            border: none; 
        }
    </style>
</head>
<body>
    <!-- ลิงก์ Web App ของคุณฝังตัวอยู่ตรงนี้แล้ว -->

</body>
</html>
